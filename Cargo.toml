[package]
name = "semitone"
version = "0.0.3"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "SeMiTONE is a Satisfiability Modulo TheOries NEtwork, allowing the creation of variables and constraints in different underlying theories."
readme = "README.md"
repository = "https://github.com/pstlab/SeMiTONE"
license-file = "LICENSE"
keywords = ["smt", "solver", "dpllt", "logic", "optimization"]
categories = ["algorithms", "mathematics", "science"]

[lib]
name = "semitone"

[[bin]]
name = "semitone"
required-features = ["parser"]

[features]
default = []
parser = ["dep:smt2parser", "dep:num-traits"]

[dependencies]
rug = "1.30.0"
rustc-hash = "2.1.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
smt2parser = { version = "0.6.1", optional = true }
num-traits = { version = "0.2.15", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parser_bench"
harness = false
required-features = ["parser"]
